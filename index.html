<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1557bd">
<title>Prince Abubakar Audu University | Department of Cyber Security Portal</title>
<style>
:root{--blue:#1557bd;--blue2:#0e4cae;--ink:#101828;--muted:#667085;--line:#e3e7ed}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--ink);
 position:relative;isolation:isolate;overflow-x:hidden;
 background:
 radial-gradient(ellipse 340px 185px at 50% -35px,rgba(21,87,189,.17) 0%,rgba(65,135,226,.09) 42%,transparent 78%),
 radial-gradient(ellipse at 12% 22%,#eaf2ff 0,transparent 40%),
 radial-gradient(ellipse at 88% 82%,#e4f6ee 0,transparent 38%),#f7f8fa;
 display:flex;justify-content:center;align-items:flex-start;padding:26px 16px 40px}
.page{width:min(100%,760px);text-align:center;position:relative;z-index:1}
.brand-header{width:100%;margin:0 auto 26px;display:flex;flex-direction:column;align-items:center}
.crest{width:76px;height:76px;object-fit:contain;margin:0 auto 10px;mix-blend-mode:multiply}
.heading-copy{width:100%;max-width:700px;padding:0 8px}
.university{font-size:clamp(21px,4vw,31px);font-weight:800;line-height:1.2;margin:0 auto 10px;letter-spacing:-.55px;text-wrap:balance}
.heading-accent{width:54px;height:4px;border-radius:8px;background:var(--blue);margin:0 auto 11px}
.department{font-size:clamp(18px,3.4vw,25px);font-weight:750;line-height:1.25;margin:0 auto 7px;text-wrap:balance}
.tagline{font-size:15px;color:#596273;margin:0;line-height:1.5}
.card{width:min(100%,620px);margin:auto;background:rgba(255,255,255,.94);border:1px solid #edf0f3;border-radius:23px;padding:32px 34px 30px;box-shadow:0 12px 38px rgba(16,24,40,.055);text-align:left}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#f0f2f4;padding:6px;border-radius:17px;margin-bottom:27px}
.tab{border:0;border-radius:13px;padding:14px 8px;background:transparent;font-size:18px;font-weight:700;color:#555e6b;cursor:pointer}
.tab.active{background:#fff;color:#164e91;box-shadow:0 2px 9px rgba(16,24,40,.10)}
.field{margin:0 0 19px}
label{display:block;font-size:18px;font-weight:700;margin:0 0 9px}
input{width:100%;height:57px;border:1.5px solid #d9dee5;border-radius:13px;padding:0 17px;font-size:17px;outline:none;background:#fff;color:#182230}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(21,87,189,.12)}
input::placeholder{color:#9299a3}
.primary{width:100%;border:0;border-radius:13px;height:59px;background:var(--blue);color:white;font-size:19px;font-weight:700;cursor:pointer;margin-top:3px;box-shadow:0 4px 10px rgba(21,87,189,.15)}
.primary:active{transform:translateY(1px);background:var(--blue2)}
.notice{margin-top:25px;background:#e8f5eb;color:#356247;border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.notice span:first-child{font-size:17px}
.switchline{text-align:center;font-size:14px;color:var(--muted);margin:19px 0 0}
.textbutton{border:0;background:none;color:var(--blue);font-weight:700;font-size:14px;cursor:pointer;padding:0}
.footer{margin:28px 0 0;color:#9298a1;font-size:11px;font-weight:700;letter-spacing:2px}
.footer small{display:block;font-size:12px;letter-spacing:0;font-weight:400;margin-top:8px}
#message{display:none;margin-top:14px;padding:11px 13px;border-radius:9px;font-size:13px;line-height:1.4}
#message.error{display:block;background:#fff0f0;color:#a32929}
#message.success{display:block;background:#eaf7ee;color:#24613b}
@media(max-width:520px){body{padding:20px 13px 30px}.brand-header{margin-bottom:22px}.crest{width:68px;height:68px;margin-bottom:8px}.heading-copy{padding:0 3px}.university{font-size:22px;line-height:1.22;letter-spacing:-.35px;margin-bottom:9px}.heading-accent{width:44px;height:3px;margin-bottom:9px}.department{font-size:19px;line-height:1.28}.tagline{font-size:14px;margin-top:6px}.card{padding:23px 18px 22px;border-radius:19px}.tab{font-size:15px;padding:13px 5px}label{font-size:16px}input{height:54px;font-size:16px}.primary{height:56px}}
</style>
</head>

  <div class="heading-copy">
    <h1 class="university">Prince Abubakar Audu University</h1>
    <div class="heading-accent" aria-hidden="true"></div>
    <h2 class="department">Department of Cyber Security Portal</h2>
    <p class="tagline">Learn. Connect. Stay Cyber Safe.</p>
  </div>
  </header>

  <section class="card" aria-label="Account access">
    <div class="tabs" role="tablist">
      <button class="tab active" id="loginTab" type="button" role="tab" aria-selected="true">Login</button>
      <button class="tab" id="signupTab" type="button" role="tab" aria-selected="false">Create account</button>
    </div>

    <form id="accountForm" novalidate>
      <div class="field" id="nameField" hidden>
        <label for="fullName">Full name</label>
        <input id="fullName" type="text" autocomplete="name" placeholder="Enter your full name">
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="At least 6 characters" required>
      </div>
      <div class="field" id="confirmField" hidden>
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Enter your password again">
      </div>
      <button class="primary" id="submitButton" type="submit">Login</button>
      <div id="message" role="status" aria-live="polite"></div>
    </form>

    <div class="notice"><span>🛡</span><span>Your information should be kept secure. Never share your password or verification codes with anyone.</span></div>
    <p class="switchline" id="switchLine">New to the portal? <button class="textbutton" id="switchButton" type="button">Create an account</button></p>
  </section>


</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  sendPasswordResetEmail, updateProfile, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase web-app configuration supplied for the PAAU Cyber Security Portal.
const firebaseConfig = {
  apiKey: "AIzaSyB4KJXS2aQXzvvRqygcxejkBPjI8Up2aAs",
  authDomain: "paau-cyber-security-portal.firebaseapp.com",
  projectId: "paau-cyber-security-portal",
  storageBucket: "paau-cyber-security-portal.firebasestorage.app",
  messagingSenderId: "365006517643",
  appId: "1:365006517643:web:8d3dd4d674bad299886b8e",
  measurementId: "G-6FQL4XCXF7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// If a student already has a valid Firebase session, continue to their dashboard.
onAuthStateChanged(auth, (user) => {
  if (user) window.location.replace('./dashboard.html');
});

const loginTab = document.getElementById('loginTab');
const signupTab = document.getElementById('signupTab');
const nameField = document.getElementById('nameField');
const confirmField = document.getElementById('confirmField');
const fullName = document.getElementById('fullName');
const confirmPassword = document.getElementById('confirmPassword');
const password = document.getElementById('password');
const emailInput = document.getElementById('email');
const submitButton = document.getElementById('submitButton');
const switchLine = document.getElementById('switchLine');
const message = document.getElementById('message');
const form = document.getElementById('accountForm');
let mode = 'login';
let busy = false;

// Change this only if your dashboard file has a different name or location.
const DASHBOARD_URL = './dashboard.html';

function showMessage(text, type='error') {
  message.textContent = text;
  message.className = type;
}
function setBusy(value) {
  busy = value;
  submitButton.disabled = value;
  submitButton.textContent = value ? 'Please wait…' : (mode === 'signup' ? 'Create account' : 'Login');
  submitButton.style.opacity = value ? '.7' : '1';
  submitButton.style.cursor = value ? 'wait' : 'pointer';
}
function firebaseMessage(error) {
  const code = error?.code || '';
  const firestoreCode = code.replace(/^firestore\//, '');
  const messages = {
    'auth/email-already-in-use': 'An account with this email already exists. Please log in instead.',
    'auth/invalid-email': 'Please enter a valid email address.',
    'auth/weak-password': 'Your password is too weak. Use at least 6 characters.',
    'auth/user-not-found': 'No account was found with this email address.',
    'auth/wrong-password': 'Incorrect email or password. Please try again.',
    'auth/user-disabled': 'This account has been disabled. Please contact the portal administrator.',
    'auth/operation-not-allowed': 'Email and password login is not enabled in Firebase Authentication.',
    'auth/invalid-login-credentials': 'Incorrect email or password. Please try again.',
    'auth/invalid-credential': 'Incorrect email or password. Please check your details.',
    'auth/too-many-requests': 'Too many attempts. Please wait a little and try again.',
    'auth/network-request-failed': 'Network error. Check your internet connection and try again.',
    'permission-denied': 'Your account was created, but the student profile could not be saved. Please contact the portal administrator.',
    'unavailable': 'The service is temporarily unavailable. Please try again.'
  };
  return messages[code] || messages[firestoreCode] || error?.message || 'Something went wrong. Please try again.';
}
function setMode(next) {
  mode = next;
  const creating = mode === 'signup';
  loginTab.classList.toggle('active', !creating);
  signupTab.classList.toggle('active', creating);
  loginTab.setAttribute('aria-selected', String(!creating));
  signupTab.setAttribute('aria-selected', String(creating));
  nameField.hidden = !creating;
  confirmField.hidden = !creating;
  fullName.required = creating;
  confirmPassword.required = creating;
  password.autocomplete = creating ? 'new-password' : 'current-password';
  submitButton.textContent = creating ? 'Create account' : 'Login';
  switchLine.innerHTML = creating
    ? 'Already have an account? <button class="textbutton" id="switchButton" type="button">Login</button>'
    : 'New to the portal? <button class="textbutton" id="switchButton" type="button">Create an account</button>';
  document.getElementById('switchButton').addEventListener('click', () => setMode(creating ? 'login' : 'signup'));
  message.className = '';
  message.textContent = '';
}

loginTab.addEventListener('click', () => setMode('login'));
signupTab.addEventListener('click', () => setMode('signup'));

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (busy) return;
  const email = emailInput.value.trim().toLowerCase();
  const pass = password.value;
  if (!email || !emailInput.checkValidity()) return showMessage('Please enter a valid email address.');
  if (pass.length < 6) return showMessage('Your password must contain at least 6 characters.');

  if (mode === 'signup') {
    const name = fullName.value.trim().replace(/\s+/g, ' ');
    if (!name) return showMessage('Please enter your full name.');
    if (pass !== confirmPassword.value) return showMessage('The passwords do not match. Please try again.');
    setBusy(true);
    try {
      const credential = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(credential.user, { displayName: name });
      await setDoc(doc(db, 'students', credential.user.uid), {
        uid: credential.user.uid,
        fullName: name,
        email,
        role: 'student',
        accountStatus: 'pending',
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      showMessage('Your account has been created successfully. Redirecting to your dashboard…', 'success');
      setTimeout(() => { window.location.href = DASHBOARD_URL; }, 1200);
    } catch (error) {
      console.error('Account creation error:', error);
      showMessage(firebaseMessage(error));
    } finally { setBusy(false); }
  } else {
    setBusy(true);
    try {
      // Firebase Authentication is the authority for login. A Firestore rules or
      // connectivity issue must not turn a valid password into a failed login.
      const credential = await signInWithEmailAndPassword(auth, email, pass);

      // Repair a missing student profile in the background. Existing records are
      // never overwritten, and profile-sync errors do not block dashboard access.
      try {
        const studentRef = doc(db, 'students', credential.user.uid);
        const studentSnapshot = await getDoc(studentRef);
        if (!studentSnapshot.exists()) {
          await setDoc(studentRef, {
            uid: credential.user.uid,
            fullName: credential.user.displayName || '',
            email: credential.user.email || email,
            role: 'student',
            accountStatus: 'pending',
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });
        }
      } catch (profileError) {
        console.warn('Login succeeded, but student profile sync was unavailable:', profileError);
      }

      showMessage('Login successful. Opening your dashboard…', 'success');
      window.setTimeout(() => { window.location.assign(DASHBOARD_URL); }, 700);
    } catch (error) {
      console.error('Login error:', error);
      showMessage(firebaseMessage(error));
      setBusy(false);
      password.focus();
    }
  }
});

// Add a password-reset action to the login view without changing the page layout.
const resetLine = document.createElement('p');
resetLine.className = 'switchline';
resetLine.style.marginTop = '12px';
resetLine.innerHTML = '<button class="textbutton" id="resetPasswordButton" type="button">Forgot password?</button>';
form.appendChild(resetLine);
document.getElementById('resetPasswordButton').addEventListener('click', async () => {
  const email = emailInput.value.trim().toLowerCase();
  if (!email || !emailInput.checkValidity()) {
    showMessage('Enter your email address above first, then tap Forgot password again.');
    emailInput.focus();
    return;
  }
  try {
    await sendPasswordResetEmail(auth, email);
    showMessage('Password reset instructions have been sent to your email address.', 'success');
  } catch (error) {
    console.error('Password reset error:', error);
    showMessage(firebaseMessage(error));
  }
});
</script>
</body>
</html>
